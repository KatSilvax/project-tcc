[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evasao_zero"
version = "0.0.1"
description = "Dashboard Preditivo de Evasão Estudantil - IFMS"
authors = [
  { name = "IFMS" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.8"

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "streamlit>=1.22.0",
    "plotly>=5.13.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.2.0",
    "imbalanced-learn>=0.10.0",
    "joblib>=1.2.0",
    "mkdocs",
    "python-dotenv",
    "ruff",
    "huggingface-hub",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "seaborn>=0.12.0",
    "pywinpty==2.0.13",
    "jupyterlab>=4.0.0",
    "nbconvert>=7.0.0",
    "sdv>=1.0.0",
    "boto3>=1.26.0",
]


[tool.ruff]
line-length = 99
src = ["evasao_zero"]
include = ["pyproject.toml", "evasao_zero/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["evasao_zero"]
force-sort-within-sections = true

